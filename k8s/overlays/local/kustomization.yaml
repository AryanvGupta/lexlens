# Local kind cluster: images are built locally and loaded with `kind load`, never pulled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - { name: lexlens/rag-api, newTag: local }
  - { name: lexlens/mcp-server, newTag: local }
  - { name: lexlens/sample-db, newTag: local }
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: { kind: StatefulSet, name: sample-db }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
