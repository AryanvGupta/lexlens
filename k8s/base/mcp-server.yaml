# Streamable-HTTP MCP endpoint. Bearer auth only if MCP_AUTH_TOKEN is in lexlens-secrets; otherwise reach it with `kubectl port-forward`, do not expose it.
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  selector: { app: mcp-server }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      containers:
        - name: mcp-server
          image: lexlens/mcp-server
          ports: [{ containerPort: 3000 }]
          env:
            - { name: MCP_TRANSPORT, value: http }
            - { name: PORT, value: "3000" }
            - { name: RAG_API_URL, value: "http://rag-api:8000" }
            - { name: MCP_ALLOWED_HOSTS, value: "localhost,127.0.0.1,mcp-server,mcp-server.lexlens.svc.cluster.local" }
            - name: SAMPLE_DB_RO_PASSWORD
              valueFrom: { secretKeyRef: { name: lexlens-secrets, key: SAMPLE_DB_RO_PASSWORD } }
            - name: MCP_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: lexlens-secrets, key: MCP_AUTH_TOKEN, optional: true } }
            - name: SAMPLE_DB_URL
              value: postgresql://lexlens_ro:$(SAMPLE_DB_RO_PASSWORD)@sample-db:5432/pagila
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
