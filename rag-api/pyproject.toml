[project]
name = "rag-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "lxml>=6.1.3",
    "pgvector>=0.5.0",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.30",
    "torch",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Linux images: CPU-only torch (the default PyPI wheel pulls several GB of CUDA libraries, even on arm64).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
