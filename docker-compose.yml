services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lexlens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  sample-db:
    build: ./sample-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SAMPLE_DB_ADMIN_PASSWORD:-}
      POSTGRES_DB: pagila
      SAMPLE_DB_RO_PASSWORD: ${SAMPLE_DB_RO_PASSWORD:-}
    ports:
      - "5433:5432"
    volumes:
      - sampledata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagila"]
      interval: 5s
      retries: 30
volumes:
  pgdata:
  sampledata:
